<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>ESQUADЯO — Plugin Lápis Raro</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="panel-container">
    
    <!-- Header: Identidade Lápis Raro -->
    <div class="panel-header">
      <div class="brand-logo">
        <span class="panel-title">ESQUADЯO</span>
      </div>
      <span class="badge-lr">LÁPIS RAЯO</span>
    </div>

    <div class="panel-body">
      
      <!-- Container Geral de Plataformas (Strip Principal + Strip Extra) -->
      <div class="platform-container">
        
        <!-- 1. Linha Principal de Ícones -->
        <div class="platform-strip">
          <div class="platform-icon active" data-platform="instagram" data-tooltip="Instagram">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.051.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 1 0 0 12.324 6.162 6.162 0 0 0 0-12.324zM12 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm6.406-11.845a1.44 1.44 0 1 0 0 2.881 1.44 1.44 0 0 0 0-2.881z"/></svg>
          </div>
          <div class="platform-icon" data-platform="facebook" data-tooltip="Facebook">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
          </div>
          <div class="platform-icon" data-platform="linkedin" data-tooltip="LinkedIn">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0z"/></svg>
          </div>
          <div class="platform-icon" data-platform="tiktok" data-tooltip="TikTok">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.06-2.89-.52-4.06-1.39v7.4c.02 1.8-.54 3.67-1.8 4.93-1.88 1.89-5.1 2.22-7.37.79-2.26-1.4-3.29-4.37-2.4-6.89.7-2.01 2.62-3.56 4.75-3.69v4.14c-1.22.11-2.45.98-2.68 2.22-.39 2.03 1.48 3.82 3.4 3.2 1.43-.47 2.22-1.99 2.2-3.48V0h.01z"/></svg>
          </div>
          <div class="platform-icon" data-platform="whatsapp" data-tooltip="WhatsApp">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946C.06 5.348 5.397.01 12.008.01c3.202.001 6.212 1.246 8.477 3.514 2.266 2.268 3.507 5.28 3.505 8.484-.004 6.657-5.34 11.997-11.953 11.997-2.005-.001-3.973-.502-5.73-1.45L0 24zm6.59-4.846c1.6.95 3.188 1.449 4.825 1.451 5.436 0 9.86-4.42 9.864-9.864.002-2.637-1.023-5.116-2.887-6.981-1.864-1.865-4.343-2.89-6.984-2.891-5.439 0-9.865 4.424-9.869 9.868-.001 1.73.454 3.42 1.32 4.922L1.875 22.02l6.237-1.636zM15.97 12.98c-.282-.143-1.67-.823-1.928-.918-.258-.095-.446-.143-.634.143-.188.285-.726.918-.89 1.11-.164.19-.327.214-.61.071-.282-.143-1.194-.44-2.274-1.402-.84-.75-1.408-1.677-1.573-1.963-.164-.285-.018-.44.123-.581.127-.127.282-.329.424-.494.143-.165.19-.282.285-.47.095-.19.047-.356-.024-.5-.071-.143-.634-1.53-.87-2.097-.229-.556-.481-.482-.663-.492-.17-.008-.364-.01-.559-.01-.195 0-.514.074-.783.37-.269.296-1.026 1.002-1.026 2.44 0 1.439 1.047 2.829 1.192 3.02.146.19 2.062 3.149 4.996 4.417.697.302 1.24.482 1.66.617.7.223 1.338.19 1.843.116.562-.083 1.67-.682 1.905-1.34.235-.658.235-1.223.164-1.34-.07-.116-.258-.19-.54-.332z"/></svg>
          </div>
          <div class="platform-icon" data-platform="youtube" data-tooltip="YouTube">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M23.498 6.163a3.003 3.003 0 0 0-2.11-2.11C19.517 3.545 12 3.545 12 3.545s-7.517 0-9.388.508a3.003 3.003 0 0 0-2.11 2.11C0 8.033 0 12 0 12s0 3.967.502 5.837a3.003 3.003 0 0 0 2.11 2.11c1.871.508 9.388.508 9.388.508s7.517 0 9.388-.508a3.003 3.003 0 0 0 2.11-2.11C24 15.967 24 12 24 12s0-3.967-.502-5.837zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
          </div>
          <!-- Botão + para expandir outras plataformas -->
          <div class="platform-icon btn-toggle-strip" id="btnToggleStrip" data-tooltip="Mais Plataformas">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
          </div>
        </div>

        <!-- 2. Linha Oculta/Extra de Ícones (Google Ads, Meta Ads, Twitter, Uber, iFood, OOH) -->
        <div class="platform-strip extended-strip" id="extendedStrip" style="display: none;">
          <!-- Google Ads (G Logo) -->
          <div class="platform-icon" data-platform="google_ads" data-tooltip="Google Ads">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12.48 10.92v3.28h7.84c-.24 1.84-.853 3.187-1.787 4.133-1.147 1.147-2.933 2.4-6.053 2.4-4.827 0-8.6-3.893-8.6-8.72s3.773-8.72 8.6-8.72c2.6 0 4.507 1.027 5.907 2.347l2.307-2.307C18.747 1.44 16.067 0 12.48 0 5.867 0 .307 5.387.307 12s5.56 12 12.173 12c3.573 0 6.267-1.173 8.373-3.36 2.16-2.16 2.84-5.213 2.84-7.667 0-.76-.053-1.467-.173-2.053H12.48z"/></svg>
          </div>
          <!-- Meta (Infinity / Möbius Loop) -->
          <div class="platform-icon" data-platform="meta_ads" data-tooltip="Meta Ads">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M16.518 7.323a4.707 4.707 0 0 0-3.327 1.378L12 9.878l-1.191-1.177A4.707 4.707 0 0 0 7.482 7.32a4.72 4.72 0 0 0-4.718 4.719c0 2.607 2.112 4.72 4.718 4.72a4.7 4.7 0 0 0 3.327-1.378L12 14.204l1.191 1.18c.884.876 2.083 1.377 3.327 1.377a4.72 4.72 0 0 0 4.718-4.719 4.72 4.72 0 0 0-4.718-4.719zM7.482 14.759a2.76 2.76 0 0 1-2.759-2.72c0-1.503 1.236-2.72 2.759-2.72a2.75 2.75 0 0 1 1.948.808L12 12.671l-2.57 2.544a2.748 2.748 0 0 1-1.948.544zm9.036 0a2.748 2.748 0 0 1-1.948-.544L12 11.669l2.57-2.544a2.748 2.748 0 0 1 1.948-.808 2.76 2.76 0 0 1 2.759 2.72 2.76 2.76 0 0 1-2.759 2.722z"/></svg>
          </div>
          <!-- X (Twitter) -->
          <div class="platform-icon" data-platform="twitter" data-tooltip="X">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
          </div>
          <!-- Uber (Ícone 'Uber' Tipográfico / Ícone Oficial) -->
          <div class="platform-icon" data-platform="uber" data-tooltip="Uber">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm3.5 13.5h-7v-7h7v2h-4.5v3H15.5v2z"/></svg>
          </div>
          <!-- iFood (Logo Oficial iFood Sorriso) -->
          <div class="platform-icon" data-platform="ifood" data-tooltip="iFood">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 15c-3.31 0-6-2.69-6-6h2c0 2.21 1.79 4 4 4s4-1.79 4-4h2c0 3.31-2.69 6-6 6zm-3-7c-.83 0-1.5-.67-1.5-1.5S8.17 7 9 7s1.5.67 1.5 1.5S9.83 10 9 10zm6 0c-.83 0-1.5-.67-1.5-1.5S14.17 7 15 7s1.5.67 1.5 1.5S15.83 10 15 10z"/></svg>
          </div>
          <!-- OOH removido: as 6 peças são tipo_midia=Impresso (app_photoshop=NAO no
               Guia de Formatos) e vivem no plugin de Illustrator, em CMYK 300 DPI escala 1:10. -->
        </div>

      </div>



      <!-- 2. Linha de Controles: Modo + Quantidade -->
      <div class="controls-row">
        <div class="mode-container">
          <div class="mode-segmented">
            <div class="mode-btn active" id="modeOrganic">Orgânico</div>
            <div class="mode-btn" id="modeAds">Anúncio</div>
          </div>
        </div>
        
        <div class="stepper-group">
          <div class="stepper-container">
            <div class="stepper-btn" id="btnMinus">−</div>
            <div id="qtdInput" class="stepper-input">1</div>
            <div class="stepper-btn" id="btnPlus">+</div>
          </div>
        </div>
      </div>

      <!-- 3. Formato de Mídia (Dropdown Customizado 100% Estilizado) -->
      <div class="custom-dropdown" id="customDropdown">
        <div class="custom-dropdown-trigger" id="dropdownTrigger">
          <span id="dropdownCurrentLabel">Carregando...</span>
          <svg class="dropdown-arrow" viewBox="0 0 10 6">
            <path d="M1 1L5 5L9 1" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="custom-dropdown-menu" id="dropdownMenu">
          <!-- Preenchido dinamicamente via JS -->
        </div>
      </div>

      <!-- Card de Preview (Identidade Lápis Raro) -->
      <div class="preview-card">
        <div class="preview-stage">
          <div id="canvasPreview" class="canvas-preview">
            <div id="safeOverlay" class="guide-overlay"></div>
            <div id="noInfoBox" class="guide-no-info"></div>
            <div id="cropOverlay" class="guide-crop-overlay"></div>
          </div>
        </div>

        <div class="preview-footer">
          <span id="dimText" class="dim-badge">1080 × 1080 px</span>
          <span id="cropNoteText" class="crop-note" style="display:none;">(Crop Feed na 1ª prancheta)</span>

          <div class="legend-row">
            <div class="legend-item" id="legendSafeItem"><div class="dot dot-safe"></div><span>Área Segura</span></div>
            <div class="legend-item" id="legendCropItem"><div class="dot dot-crop"></div><span>Linhas de Corte</span></div>
          </div>
        </div>
      </div>

      <!-- Tooltip Flutuante Dinâmico -->
      <div id="floatingTooltip" class="floating-tooltip"></div>

      <!-- Grupo de Ações (Botões Originais Identidade Lápis Raro) -->
      <div class="button-group">
        <div class="btn-primary" id="btnCreate">
          <span id="btnActionLabel">Criar Prancheta</span>
        </div>
        <div class="btn-secondary" id="btnGuidesOnly">
          Aplicar Apenas Guias
        </div>
      </div>

      <div id="toast" class="toast-msg">
        ✅ Ação realizada com sucesso!
      </div>

    </div>

    <div class="panel-footer">
      <div class="footer-brand-label">BRAND INTELLIGENCE • 2026</div>
      <div class="theme-palette" id="themePalette">
        <div class="color-dot active" data-color="#E61C00" data-name="Vermelho Raro" title="Vermelho Raro (#E61C00)" style="background-color: #E61C00;"></div>
        <div class="color-dot" data-color="#a2d2eb" data-name="Azul Raro" title="Azul Raro (#A2D2EB)" style="background-color: #a2d2eb;"></div>
        <div class="color-dot" data-color="#fea8fe" data-name="Rosa Raro" title="Rosa Raro (#FEA8FE)" style="background-color: #fea8fe;"></div>
        <div class="color-dot" data-color="#222222" data-name="Noir Raro" title="Noir Raro (#222222)" style="background-color: #222222;"></div>
      </div>
    </div>

  </div>

  <script src="js/main.js"></script>
</body>
</html>
